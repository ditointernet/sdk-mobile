name: iOS SDK CI

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Check for relevant changes
      id: check-changes
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
        else
          BASE_REF="${{ github.event.before }}"
          HEAD_REF="${{ github.event.after }}"
        fi

        if [ -z "$BASE_REF" ] || [ "$BASE_REF" == "0000000000000000000000000000000000000000" ]; then
          BASE_REF="HEAD~1"
        fi

        CHANGED_FILES=$(git diff --name-only "$BASE_REF".."$HEAD_REF" | grep -E "^(ios/|\.github/workflows/ios\.yml$)" || true)

        if [ -z "$CHANGED_FILES" ]; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -vE "(Tests/|.*Test\.swift$|.*Tests\.swift$|\.github/workflows/ios\.yml$)" | grep -E "\.(swift|m|h|plist|podspec|pbxproj)$" || true)

        if [ -n "$CODE_CHANGES" ] || echo "$CHANGED_FILES" | grep -q "\.github/workflows/ios\.yml$"; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Setup Xcode
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Generate Xcode project and workspace
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        brew install xcodegen
        cd ios
        xcodegen generate

    - name: Build iOS SDK
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        cd ios
        xcodebuild -project DitoSDK.xcodeproj -scheme DitoSDK -configuration Release -destination 'generic/platform=iOS' clean build

    - name: Validate DITO test credentials
      if: steps.check-changes.outputs.has_changes == 'true'
      env:
        DITO_TEST_API_KEY: ${{ secrets.DITO_TEST_API_KEY }}
        DITO_TEST_API_SECRET: ${{ secrets.DITO_TEST_API_SECRET }}
        DITO_TEST_X_API_KEY: ${{ secrets.DITO_TEST_X_API_KEY }}
      run: |
        SECRET_TRIMMED=$(printf '%s' "${DITO_TEST_API_SECRET:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        if [ -n "$SECRET_TRIMMED" ]; then
          KEY_TRIMMED=$(printf '%s' "${DITO_TEST_API_KEY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$KEY_TRIMMED" ]; then
            echo "::error::No fluxo legado (DITO_TEST_API_SECRET preenchido após trim), configure o secret DITO_TEST_API_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
        else
          X_TRIMMED=$(printf '%s' "${DITO_TEST_X_API_KEY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$X_TRIMMED" ]; then
            echo "::error::No modo solo (DITO_TEST_API_SECRET vazio ou ausente após trim), configure o secret DITO_TEST_X_API_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
        fi

    - name: Resolve iOS Simulator UDID
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        set -euo pipefail
        LINE=$(xcrun simctl list devices available | grep iPhone | head -n 1 || true)
        if [ -z "$LINE" ]; then
          echo "::error::Nenhum simulador disponível cuja linha contenha \"iPhone\" em xcrun simctl list devices available."
          exit 1
        fi
        UDID=$(echo "$LINE" | grep -Eo '[0-9A-F-]{36}' | head -n 1)
        if [ -z "$UDID" ]; then
          echo "::error::Não foi possível extrair um UUID (regex [0-9A-F-]{36}) da linha do simulador: $LINE"
          exit 1
        fi
        echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
        echo "Simulador escolhido (UDID): $UDID"

    - name: Run Tests
      if: steps.check-changes.outputs.has_changes == 'true'
      env:
        DITO_TEST_API_KEY: ${{ secrets.DITO_TEST_API_KEY }}
        DITO_TEST_API_SECRET: ${{ secrets.DITO_TEST_API_SECRET }}
        DITO_TEST_X_API_KEY: ${{ secrets.DITO_TEST_X_API_KEY }}
      run: |
        cd ios
        xcodebuild test -project DitoSDK.xcodeproj -scheme DitoSDK -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID"

    - name: Upload artifacts
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/build
        if-no-files-found: ignore

  release:
    needs: build
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: check-changes
        run: |
          BASE_REF=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~1")
          CHANGED_FILES=$(git diff --name-only "$BASE_REF"..HEAD | grep "^ios/" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -vE "(Tests/|.*Test\.swift$|.*Tests\.swift$)" | grep -E "\.(swift|m|h|plist|podspec|pbxproj)$|^ios/Podfile$|^ios/project\.yml$" || true)

          if [ -n "$CODE_CHANGES" ]; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Xcode
        if: steps.check-changes.outputs.has_code_changes == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project and workspace
        if: steps.check-changes.outputs.has_code_changes == 'true'
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate

      - name: Build iOS SDK
        if: steps.check-changes.outputs.has_code_changes == 'true'
        run: |
          cd ios
          xcodebuild -project DitoSDK.xcodeproj -scheme DitoSDK -configuration Release -destination 'generic/platform=iOS' clean build

      - name: Publish to CocoaPods
        if: steps.check-changes.outputs.has_code_changes == 'true'
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          cd ios
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "COCOAPODS_TRUNK_TOKEN not set, skipping CocoaPods publish"
            exit 0
          fi

          # DitoSDK depends on DitoSDKNotificationService at an exact version, so
          # the extension-safe pod has to exist on trunk before DitoSDK is even
          # linted. Order here is load-bearing, not cosmetic.
          push_pod() {
            local spec="$1"
            local out
            if out="$(pod trunk push "$spec" --allow-warnings 2>&1)"; then
              echo "$out"
              return 0
            fi
            echo "$out"
            # Re-running a release must not fail on an already-published version.
            if echo "$out" | grep -qi "duplicate entry"; then
              echo "$spec already published at this version, continuing"
              return 0
            fi
            return 1
          }

          push_pod DitoSDKNotificationService.podspec
          push_pod DitoSDK.podspec
