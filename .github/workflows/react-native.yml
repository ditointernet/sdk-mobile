name: React Native Plugin CI

on:
  pull_request:
    paths:
      - 'react-native/**'
      - '.github/workflows/react-native.yml'
      - 'scripts/check-version-pins.sh'
      - 'scripts/react-native-android-smoke.sh'
      - 'scripts/semantic-release/**'
      - '.github/semantic-release/**'
      - 'DitoSDK.podspec'
      - 'DitoSDKNotificationService.podspec'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # Fora do has_changes: o podspec iOS não é ts/js/json e o check usa o node do runner.
    - name: Check the DitoSDK version the plugin asks for
      run: ./scripts/check-version-pins.sh

    - name: Check for relevant changes
      id: check-changes
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          HEAD_REF="${{ github.event.pull_request.head.sha }}"
        else
          BASE_REF="${{ github.event.before }}"
          HEAD_REF="${{ github.event.after }}"
        fi

        if [ -z "$BASE_REF" ] || [ "$BASE_REF" == "0000000000000000000000000000000000000000" ]; then
          BASE_REF="HEAD~1"
        fi

        CHANGED_FILES=$(git diff --name-only "$BASE_REF".."$HEAD_REF" | grep -E "^(react-native/|\.github/workflows/react-native\.yml$)" || true)

        if [ -z "$CHANGED_FILES" ]; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -vE "(__tests__/|.*\.test\.(ts|tsx)$|.*\.spec\.(ts|tsx)$|\.github/workflows/react-native\.yml$)" | grep -E "\.(ts|tsx|js|jsx|json)$" || true)

        if [ -n "$CODE_CHANGES" ] || echo "$CHANGED_FILES" | grep -q "\.github/workflows/react-native\.yml$"; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Node.js
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        cd react-native
        npm install

    - name: Lint
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        cd react-native
        npm run lint || echo "Lint script not configured"

    - name: Run tests
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        cd react-native
        npm test -- --coverage || echo "Tests not configured"

    - name: Type check
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        cd react-native
        npm run type-check || npx tsc --noEmit || echo "TypeScript not configured"

    - name: Upload artifacts
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: react-native-build
        path: react-native/dist
        if-no-files-found: ignore

  # Compila o pacote como o app integrador recebe do npm: só o que o `npm pack` publica.
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for relevant changes
      id: check-changes
      run: |
        BASE_REF="${{ github.event.pull_request.base.sha }}"
        HEAD_REF="${{ github.event.pull_request.head.sha }}"
        if git diff --name-only "$BASE_REF".."$HEAD_REF" | grep -qE "^(react-native/android/|react-native/package\.json$|react-native/src/|\.github/workflows/react-native\.yml$|scripts/check-version-pins\.sh$|scripts/react-native-android-smoke\.sh$|scripts/semantic-release/|\.github/semantic-release/)"; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up JDK 17
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Set up Node.js
      if: steps.check-changes.outputs.has_changes == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build a clean React Native app with the packed plugin
      if: steps.check-changes.outputs.has_changes == 'true'
      run: bash scripts/react-native-android-smoke.sh "$RUNNER_TEMP/smoke"
