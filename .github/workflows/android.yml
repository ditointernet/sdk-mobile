name: Android SDK CI

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DITO_TEST_API_KEY: ${{ secrets.DITO_TEST_API_KEY }}
      DITO_TEST_API_SECRET: ${{ secrets.DITO_TEST_API_SECRET }}
      DITO_TEST_X_API_KEY: ${{ secrets.DITO_TEST_X_API_KEY }}

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Validate DITO test credentials
      run: |
        SECRET_TRIMMED=$(printf '%s' "${DITO_TEST_API_SECRET:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        if [ -n "$SECRET_TRIMMED" ]; then
          KEY_TRIMMED=$(printf '%s' "${DITO_TEST_API_KEY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$KEY_TRIMMED" ]; then
            echo "::error::No fluxo legado (DITO_TEST_API_SECRET preenchido após trim), configure o secret DITO_TEST_API_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
        else
          X_TRIMMED=$(printf '%s' "${DITO_TEST_X_API_KEY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$X_TRIMMED" ]; then
            echo "::error::No modo solo (DITO_TEST_API_SECRET vazio ou ausente após trim), configure o secret DITO_TEST_X_API_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
        fi

    # Um bump só do Android deixa o plugin Flutter fixando uma versão que não existe, e o
    # sintoma aparece na mão de quem compila o app. Falhar aqui é mais barato.
    - name: Check the SDK version the Flutter plugin pins
      run: ./scripts/check-version-pins.sh

    - name: Build Android SDK
      working-directory: android
      run: ./gradlew :dito-sdk:build

    - name: Run Tests
      working-directory: android
      run: ./gradlew :dito-sdk:test

    - name: Run Lint
      working-directory: android
      run: ./gradlew :dito-sdk:lint

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: android/dito-sdk/build/outputs
        if-no-files-found: ignore

