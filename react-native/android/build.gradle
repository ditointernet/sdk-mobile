import groovy.json.JsonSlurper

buildscript {
    def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.0.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def useLocalDitoAndroidSdk = new File(projectDir, '.use_local_dito_android_sdk').exists()
def ditoAndroidSdkVersion = System.getenv("DITO_ANDROID_SDK_VERSION") ?: "3.8.0"

// O app resolve as dependências transitivas desta lib com os repositórios dele, não com os daqui;
// exclusiveContent impede que o ditosdk do Central ganhe do local pela ordem dos repositórios.
if (useLocalDitoAndroidSdk) {
    rootProject.allprojects {
        repositories {
            exclusiveContent {
                forRepository { mavenLocal() }
                filter { includeGroup 'br.com.dito' }
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

// node_modules deste pacote (build isolado) ou do app (node_modules/@ditointernet/dito-sdk/android).
def resolveReactNativeVersion() {
    for (candidate in ['../node_modules/react-native/package.json',
                       '../../../react-native/package.json']) {
        def manifest = file(candidate)
        if (manifest.exists()) {
            return new JsonSlurper().parseText(manifest.text).version
        }
    }
    return '0.76.0'
}

def reactNativeVersion = resolveReactNativeVersion()

android {
    namespace 'br.com.dito'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/java'
    }

    defaultConfig {
        minSdk 26
    }
}

dependencies {
    implementation "br.com.dito:ditosdk:$ditoAndroidSdkVersion"
    // react-android: `com.facebook.react:react-native` parou na 0.20.1. compileOnly: o React em runtime é o do app.
    compileOnly "com.facebook.react:react-android:$reactNativeVersion"
    implementation 'com.google.firebase:firebase-messaging:23.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
