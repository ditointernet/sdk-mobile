# Este módulo não tinha gradle.properties, e a :dito-sdk — que ele inclui como projeto —
# usa Room e AndroidX. Sem `useAndroidX` o build falha antes de compilar qualquer linha.
# Os valores acompanham `android/gradle.properties`, para os dois builds da :dito-sdk
# saírem iguais.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# A :dito-sdk compila com compileSdk 36, mais novo que o que este AGP conhece oficialmente.
android.suppressUnsupportedCompileSdk=36
