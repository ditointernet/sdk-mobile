name: sample_application
description: "A new Flutter project."
version: 1.0.0+1
publish_to: none

# Espelha o `environment:` do plugin em `../pubspec.yaml`. Declarar 3.5.0 aqui era
# ficção: o path dependency do dito_sdk já exigia Dart 3.10.7 na resolução.
environment:
  sdk: '>=3.10.7 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  dito_sdk:
    path: ../

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
      - .env.development.local