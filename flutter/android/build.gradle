group = "br.com.dito.ditosdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// A bridge Flutter consome a SDK Android como artefato publicado, não como módulo do
// repo, então recurso novo na SDK nativa só compila aqui depois de publicado. Isso
// tornava impossível compilar ou validar em device o push rico antes de um release —
// e a sessão do E9 roda justamente no sample do Flutter.
//
// O escape hatch espelha o que o iOS já tinha (ver flutter/sample_application/ios/Podfile
// e o marcador flutter/ios/.use_local_dito_ios_sdk):
//
//   1. cd android && VERSION_NAME=4.0.0 ./gradlew :dito-sdk:publishReleasePublicationToMavenLocal
//   2. touch flutter/android/.use_local_dito_android_sdk
//   3. export DITO_ANDROID_SDK_VERSION=4.0.0
//
// Sem o marcador nada muda: resolve de google()/mavenCentral() como antes.
//
// O default abaixo tem de ser a versão que existe em android/dito-sdk/build.gradle.kts —
// scripts/check-version-pins.sh reprova o contrário. Pedir uma versão inventada quebra até
// o modo local, porque o `mavenLocal()` também só tem o que foi publicado dali.
def useLocalDitoAndroidSdk = new File(projectDir, ".use_local_dito_android_sdk").exists()
def ditoAndroidSdkVersion = System.getenv("DITO_ANDROID_SDK_VERSION") ?: "4.0.0"

allprojects {
    repositories {
        if (useLocalDitoAndroidSdk) {
            mavenLocal()
        }
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "br.com.dito.ditosdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 26
    }   

    dependencies {
        // 4.0.0 é a versão do repositório, onde o push rico (E3) entra, e **ainda não está
        // publicada** no Maven Central — que tem no máximo a 3.5.0. Até o release, use o
        // escape hatch documentado no topo deste arquivo.
        implementation("br.com.dito:ditosdk:$ditoAndroidSdkVersion")
        implementation("com.google.firebase:firebase-messaging:23.4.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
