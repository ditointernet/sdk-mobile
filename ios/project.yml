name: DitoSDK
options:
  bundleIdPrefix: br.com.dito
  deploymentTarget:
    iOS: 16.0
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.10.0
  Promises:
    url: https://github.com/google/promises.git
    from: 2.4.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: 1.28.0
  ConnectSwift:
    url: https://github.com/connectrpc/connect-swift
    from: 0.14.0
targets:
  Sample:
    type: application
    platform: iOS
    sources:
      - path: SampleApplication
        excludes:
          - "*.md"
          - "ViewControllerComplete.swift"
          - "Main.storyboard"
          - "NotificationDebugViewController.swift"
          - "EnvLoader.swift"
          - "Info.plist"
          - "NotificationServiceExtension/**"
    dependencies:
      - target: DitoSDK
      # DitoSDK e a extensão linkam ambos este framework via @rpath; é a app que
      # o tem de embeber, senão o dyld falha no arranque. A app não precisa de
      # linkar contra ele — chega-lhe via DitoSDK — por isso só embebe.
      - target: DitoSDKNotificationService
        embed: true
        link: false
      - target: SampleNotificationService
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Promises
        product: FBLPromises
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.dito.samplesdk
        INFOPLIST_FILE: SampleApplication/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        MOBILE_INGEST_URL: https://ingest.dito.com.br/mobile
        MOBILE_INGEST_API_KEY: local-test-key
      configs:
        Debug:
          MOBILE_INGEST_URL: http://localhost:8080
        Release:
          MOBILE_INGEST_URL: https://ingest.dito.com.br/mobile

  # Notification Service Extension do sample app. Serve de exemplo e prova que
  # DitoSDKNotificationService linka mesmo num target de extensão.
  SampleNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: SampleApplication/NotificationServiceExtension
        excludes:
          - "Info.plist"
    dependencies:
      # embed: false — quem embebe o framework é a app hospedeira.
      - target: DitoSDKNotificationService
        embed: false
    settings:
      base:
        INFOPLIST_FILE: SampleApplication/NotificationServiceExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: br.com.dito.samplesdk.notificationservice
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1

  # Extension-safe subset linked by a Notification Service Extension.
  # APPLICATION_EXTENSION_API_ONLY makes the split enforced rather than
  # cosmetic: the build fails if this target ever reaches for app-only API.
  DitoSDKNotificationService:
    type: framework
    platform: iOS
    sources:
      - path: DitoNotificationService
        name: NotificationService
        createIntermediateGroups: true
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: 3.5.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: br.com.dito.DitoSDKNotificationService

  DitoSDK:
    type: framework
    platform: iOS
    dependencies:
      - target: DitoSDKNotificationService
      - package: SwiftProtobuf
        product: SwiftProtobuf
      - package: ConnectSwift
        product: Connect
    sources:
      - path: DitoSDK/Sources
        name: Sources
        createIntermediateGroups: true
      - path: DitoSDK/Persistence
        name: Persistence
        createIntermediateGroups: true
      - path: DitoSDK/DitoSDK/DitoSDK.docc
        name: Documentation
        optional: true
    settings:
      base:
        INFOPLIST_FILE: DitoSDK/Info.plist
        MARKETING_VERSION: 3.2.1
        CURRENT_PROJECT_VERSION: 1

  DitoSDKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DitoSDKTests
    dependencies:
      - target: DitoSDK
      # Explícito: os testes fazem `@testable import DitoSDKNotificationService`,
      # que já não chega por reexportação depois de trocar @_exported por typealias.
      - target: DitoSDKNotificationService
    settings:
      base:
        INFOPLIST_FILE: DitoSDKTests/Info.plist

schemes:
  DitoSDK:
    build:
      targets:
        DitoSDK: all
        DitoSDKTests: [test]
    test:
      targets:
        - DitoSDKTests

